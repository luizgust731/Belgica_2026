<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇧🇪</text></svg>">
  <title>Rumo à Bélgica 🇧🇪</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Montserrat',sans-serif;
      background:linear-gradient(180deg,#1a1a40 0%,#3b3b80 45%,#e8b84b 80%,#f6dca0 100%);
      background-attachment:fixed;color:#fff;min-height:100vh;overflow-x:hidden;position:relative;
    }
    .bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
    .bg-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;
      background:linear-gradient(180deg,rgba(26,26,64,.35) 0%,rgba(26,26,64,.15) 50%,rgba(26,26,64,.45) 100%);}
    .topbar{width:100%;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;padding:20px;z-index:5;position:relative}
    .mini-card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);
      border-radius:20px;padding:12px 18px;min-width:250px;text-align:center;box-shadow:0 0 20px rgba(0,0,0,.2);font-size:.95rem}
    .container{width:min(95%,1400px);margin:auto;text-align:center;position:relative;z-index:4;padding:20px}
    .flag{font-size:90px;margin-top:20px;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    h1{font-size:clamp(2.5rem,7vw,6rem);font-weight:900;margin-top:10px;text-shadow:0 2px 24px rgba(0,0,0,.4)}
    .subtitle{margin-top:10px;font-size:clamp(1rem,2vw,1.4rem);opacity:.95;text-shadow:0 1px 10px rgba(0,0,0,.4)}
    .countdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-top:50px}
    .card{background:rgba(26,26,64,.35);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);
      border-radius:30px;padding:35px 20px;box-shadow:0 0 25px rgba(0,0,0,.25);transition:.3s}
    .card:hover{transform:translateY(-5px) scale(1.02)}
    .number{font-size:clamp(3rem,8vw,6rem);font-weight:900;line-height:1}
    .label{margin-top:10px;font-size:1rem;letter-spacing:2px;text-transform:uppercase;opacity:.9}
    .extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:40px;margin-bottom:40px}
    .panel{background:rgba(26,26,64,.35);border:1px solid rgba(255,255,255,.25);border-radius:25px;padding:25px;
      text-align:left;backdrop-filter:blur(10px)}
    .panel h2{margin-bottom:15px;font-size:1.3rem}
    .line{margin-bottom:12px;line-height:1.5}
    .trivia-text{min-height:70px;display:flex;align-items:center;font-size:1.05rem;line-height:1.5}
    .trivia-btn{margin-top:15px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
      font-family:'Montserrat',sans-serif;font-weight:700;padding:10px 18px;border-radius:16px;cursor:pointer;
      transition:.25s;font-size:.9rem}
    .trivia-btn:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
    .footer{margin-top:20px;margin-bottom:60px;font-size:1rem;text-shadow:0 1px 10px rgba(0,0,0,.5)}
    @media(max-width:768px){.mini-card{width:100%}.card{padding:25px 15px}.number{font-size:4rem}.flag{font-size:70px}}
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="poster_belgica.jpg">
    <source src="fundo_belgica.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <div class="topbar">
    <div class="mini-card" id="clockCity">🕒 Carregando horário...</div>
    <div class="mini-card" id="weatherCity">☀️ Carregando clima...</div>
    <div class="mini-card" id="currencyCity">💵 Carregando cotação...</div>
  </div>

  <div class="container">
    <div class="flag">🇧🇪</div>
    <h1>RUMO À BÉLGICA</h1>
    <div class="subtitle">Bruxelas & Paris • 28 de Novembro de 2026</div>

    <div class="countdown">
      <div class="card"><div class="number" id="days">00</div><div class="label">Dias</div></div>
      <div class="card"><div class="number" id="hours">00</div><div class="label">Horas</div></div>
      <div class="card"><div class="number" id="minutes">00</div><div class="label">Minutos</div></div>
      <div class="card"><div class="number" id="seconds">00</div><div class="label">Segundos</div></div>
    </div>

    <div class="extras">
      <div class="panel">
        <h2>📊 Conversões Totais</h2>
        <div class="line" id="totalHours"></div>
        <div class="line" id="totalMinutes"></div>
        <div class="line" id="totalSeconds"></div>
      </div>
      <div class="panel">
        <h2>💡 Você sabia?</h2>
        <div class="trivia-text" id="triviaText"></div>
        <button class="trivia-btn" id="triviaBtn">🔄 Outra curiosidade</button>
      </div>
    </div>

    <div class="footer">Bruxelas • Bruges • Paris • Chocolate • Waffles • Torre Eiffel 🇧🇪🇫🇷</div>
  </div>

  <script>
    const TARGET_DATE = '2026-11-28T07:00:00';
    const TIMEZONE = 'Europe/Brussels';
    const LAT = 50.8503, LON = 4.3517; // Bruxelas

    const targetDate = new Date(TARGET_DATE);
    function updateCountdown(){
      const diff = targetDate - new Date();
      if(diff <= 0){
        document.body.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;flex-direction:column;
                      height:100vh;color:white;font-family:Montserrat;text-align:center;
                      background:linear-gradient(180deg,#1a1a40,#e8b84b);">
            <h1 style="font-size:4rem;">🇧🇪 CHEGOU O DIA 🇧🇪</h1>
            <p style="font-size:2rem;">Boa viagem para a Bélgica e Paris!</p>
          </div>`;
        return;
      }
      const days=Math.floor(diff/86400000), hours=Math.floor((diff/3600000)%24),
            minutes=Math.floor((diff/60000)%60), seconds=Math.floor((diff/1000)%60);
      document.getElementById('days').innerText=String(days).padStart(2,'0');
      document.getElementById('hours').innerText=String(hours).padStart(2,'0');
      document.getElementById('minutes').innerText=String(minutes).padStart(2,'0');
      document.getElementById('seconds').innerText=String(seconds).padStart(2,'0');
      document.getElementById('totalHours').innerHTML=`⏳ ${Math.floor(diff/3600000).toLocaleString()} horas`;
      document.getElementById('totalMinutes').innerHTML=`🕐 ${Math.floor(diff/60000).toLocaleString()} minutos`;
      document.getElementById('totalSeconds').innerHTML=`⚡ ${Math.floor(diff/1000).toLocaleString()} segundos`;
    }
    setInterval(updateCountdown,1000); updateCountdown();

    function updateClock(){
      const now=new Date().toLocaleString('pt-BR',{timeZone:TIMEZONE,hour:'2-digit',minute:'2-digit',second:'2-digit',
        day:'2-digit',month:'2-digit',year:'numeric'});
      document.getElementById('clockCity').innerHTML=`🕒 Bruxelas agora: <strong>${now}</strong>`;
    }
    setInterval(updateClock,1000); updateClock();

    async function getWeather(){
      try{
        const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true`);
        const d=await r.json();
        document.getElementById('weatherCity').innerHTML=`☀️ ${d.current_weather.temperature}°C • 💨 ${d.current_weather.windspeed} km/h`;
      }catch(e){document.getElementById('weatherCity').innerHTML='❌ Clima indisponível';}
    }
    getWeather();

    async function getCurrency(){
      try{
        const r=await fetch('https://economia.awesomeapi.com.br/json/last/BRL-EUR');
        const d=await r.json();
        document.getElementById('currencyCity').innerHTML=`💵 1 BRL ≈ ${Number(d.BRLEUR.bid).toFixed(3)} EUR`;
      }catch(e){document.getElementById('currencyCity').innerHTML='❌ Cotação indisponível';}
    }
    getCurrency();

    const trivia = [
      "A Bélgica tem mais de 1.500 tipos diferentes de cerveja, e a tradição cervejeira trapista é reconhecida pela UNESCO.",
      "Bruxelas é a sede de instituições da União Europeia e também da OTAN.",
      "O Manneken Pis, estátua de um menino fazendo xixi, é um dos símbolos mais famosos de Bruxelas desde o século XVII.",
      "O waffle belga original é a receita de Bruxelas (mais leve e retangular) e a de Liège (mais densa e doce, com pérolas de açúcar).",
      "A cidade de Bruges é cortada por canais e por isso é apelidada de 'Veneza do Norte'.",
      "O chocolate belga é protegido por tradição artesanal desde o século XIX, e o país tem mais de 2.000 chocolaterias.",
      "A Grand Place de Bruxelas é Patrimônio Mundial da UNESCO desde 1998, com fachadas douradas de guildas medievais.",
      "A banda desenhada (quadrinhos) é tão valorizada na Bélgica que Bruxelas tem dezenas de murais de personagens como Tintim espalhados pela cidade.",
      "Paris é conhecida como a 'Cidade Luz' porque foi uma das primeiras grandes cidades da Europa a adotar iluminação pública em larga escala, no século XIX.",
      "A Torre Eiffel foi construída em 1889 para a Exposição Universal e, originalmente, era para ser desmontada depois de 20 anos.",
      "O Museu do Louvre, em Paris, é o museu mais visitado do mundo e abriga a Mona Lisa, de Leonardo da Vinci.",
      "Notre-Dame de Paris, catedral gótica do século XII, passou por um grande incêndio em 2019 e foi reaberta ao público em 2024.",
      "Bruxelas fica a menos de 1h30 de trem de Paris pela linha de alta velocidade, o que torna comum combinar as duas cidades numa mesma viagem.",
      "A Bélgica é oficialmente trilíngue: neerlandês (flamengo), francês e alemão são todos idiomas oficiais do país.",
      "O Atomium, construído em Bruxelas para a Expo 58, representa uma célula de ferro ampliada 165 bilhões de vezes."
    ];
    let lastIndex=-1;
    function showTrivia(){
      let idx; do{idx=Math.floor(Math.random()*trivia.length);}while(idx===lastIndex && trivia.length>1);
      lastIndex=idx;
      document.getElementById('triviaText').innerText=trivia[idx];
    }
    document.getElementById('triviaBtn').addEventListener('click', showTrivia);
    showTrivia();
  </script>

</body>
</html>
